<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智投引擎 · 全域智能投流平台</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="target"></i></div>
        <div class="brand-text">
          <strong>智投引擎</strong>
          <span>AdFlow Intelligence</span>
        </div>
      </div>

      <div class="nav-label">工作台</div>
      <nav class="nav" id="nav-main">
        <button class="nav-item active" data-section="overview"><i data-lucide="layout-dashboard"></i><span>总览驾驶舱</span></button>
      </nav>

      <div class="nav-label">投放分析</div>
      <nav class="nav" id="nav-analysis">
        <button class="nav-item" data-section="channels"><i data-lucide="glob-2"></i><span>渠道矩阵</span></button>
        <button class="nav-item" data-section="funnel"><i data-lucide="filter"></i><span>漏斗诊断</span></button>
        <button class="nav-item" data-section="roi"><i data-lucide="chart-no-axes-combined"></i><span>ROI 对比</span></button>
        <button class="nav-item" data-section="assets"><i data-lucide="tags"></i><span>商品与关键词</span></button>
      </nav>

      <div class="nav-label">智能决策</div>
      <nav class="nav" id="nav-decision">
        <button class="nav-item" data-section="strategy"><i data-lucide="wand-sparkles"></i><span>AI 投流策略</span><em class="dot hot"></em></button>
        <button class="nav-item" data-section="execution"><i data-lucide="play-circle"></i><span>投流执行中心</span><em class="dot hot"></em></button>
        <button class="nav-item" data-section="forecast"><i data-lucide="trending-up"></i><span>销售预测</span></button>
      </nav>

      <div class="sidebar-footer">
        <div class="engine-status">
          <span class="pulse"></span>
          <div><strong>分析引擎运行中</strong><small id="engineTime">上次计算 刚刚</small></div>
        </div>
        <button class="ghost-btn" id="settingsBtn"><i data-lucide="sliders-horizontal"></i> 数据与模型配置</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumb"><span>工作台</span><i data-lucide="chevron-right"></i><strong id="crumb">总览驾驶舱</strong></div>
        </div>
        <div class="topbar-right">
          <div class="range-select" id="rangeSelect">
            <button data-days="7">近 7 天</button>
            <button data-days="30" class="active">近 30 天</button>
            <button data-days="90">近 90 天</button>
          </div>
          <div class="sync-pill"><span class="pulse"></span> 5 个渠道已接入 · <span id="execBadge">0 项执行</span></div>
          <button class="icon-btn" id="notifyBtn" title="预警"><i data-lucide="bell"></i><span class="badge" id="alertCount">4</span></button>
          <button class="icon-btn" id="refreshBtn" title="重新计算"><i data-lucide="refresh-cw"></i></button>
          <div class="avatar">AF</div>
        </div>
      </header>

      <main id="app"></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop"></div>

  <button class="chat-fab" id="chatFab" title="AI 投流助手"><i data-lucide="bot"></i><span class="fab-badge">AI</span></button>
  <section class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <div class="chat-head-title">
        <div class="chat-avatar"><i data-lucide="sparkles"></i></div>
        <div><strong>投流助手</strong><small><span class="pulse"></span> 在线 · 基于全域投放数据</small></div>
      </div>
      <button class="icon-btn" id="chatClose" title="收起"><i data-lucide="x"></i></button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-quick" id="chatQuick">
      <button class="chip" data-q="哪个渠道最值得加投？">最该加投的渠道</button>
      <button class="chip" data-q="哪个商品应该减投或暂停？">该减投的商品</button>
      <button class="chip" data-q="预测下个月的销售额是多少？">下月销售额</button>
      <button class="chip" data-q="TikTok 的漏斗卡在哪里？">TikTok 漏斗诊断</button>
    </div>
    <div class="chat-input-wrap">
      <input id="chatInput" type="text" placeholder="问我任何关于投流的问题…" autocomplete="off" />
      <button class="chat-send" id="chatSend" title="发送"><i data-lucide="send"></i></button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
